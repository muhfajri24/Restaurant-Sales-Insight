name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Generate analytical artifacts
        run: python run_pipeline.py

      - name: Test with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Validate repository
        run: python validate_project.py

      - name: Smoke-test Streamlit import
        run: python -c "import app; print('DASHBOARD_IMPORT_OK')"
